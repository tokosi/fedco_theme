[project]
name = "fedco_theme"
authors = [{ name = "FEDCO", email = "it@fedco.example" }]
description = "FEDCO brand theme for ERPNext v16: desk, login and portal"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
